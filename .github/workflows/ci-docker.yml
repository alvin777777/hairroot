name: CI & Docker Build

on:
  workflow_call:
  pull_request:
    branches: [sprint-1-staging, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hairroot
          POSTGRES_PASSWORD: hairroot
          POSTGRES_DB: hairroot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hairroot -d hairroot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install, migrate, seed, and test server
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://hairroot:hairroot@localhost:5432/hairroot?schema=public
          TEST_DATABASE_URL: postgresql://hairroot:hairroot@localhost:5432/hairroot?schema=public
          SEED_DEMO_PASSWORD: CI-only-demo-password
          SEED_RESET: "true"
        run: |
          npm ci
          npm run db:migrate
          npm run db:seed
          npm test

      - name: Install, test, and build client
        working-directory: ./client
        run: |
          npm ci
          npm test
          npm run build

      - name: Build Docker image
        run: docker build .
